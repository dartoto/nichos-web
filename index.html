<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial del Fallecido</title>
  <meta name="description" content="Consulta la memoria y el historial de un ser querido.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #f7f5f0;
      --bg-2: #e8e4da;
      --card-bg: #fffdf9;
      --text: #2c3e50;
      --text-soft: #6b7280;
      --accent: #8a9a8b;
      --accent-soft: #d9e0d9;
      --shadow: 0 20px 60px rgba(44, 62, 80, 0.14), 0 2px 8px rgba(44, 62, 80, 0.06);
      --serif-display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
      --serif-body: 'Lora', Georgia, 'Times New Roman', serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    body {
      font-family: var(--serif-body);
      color: var(--text);
      background:
        radial-gradient(circle at 15% 10%, rgba(138, 154, 139, 0.13), transparent 55%),
        radial-gradient(circle at 90% 90%, rgba(44, 62, 80, 0.10), transparent 55%),
        linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 20px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: var(--card-bg);
      border-radius: 4px;
      box-shadow: var(--shadow);
      padding: 64px 56px 56px;
      position: relative;
      animation: fadeIn 0.8s ease;
    }

    /* Doble filete ornamental arriba y abajo */
    .card::before,
    .card::after {
      content: "";
      position: absolute;
      left: 40px;
      right: 40px;
      height: 1px;
      background: var(--accent-soft);
    }
    .card::before { top: 20px; }
    .card::after  { bottom: 20px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .photo {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 8px 30px rgba(44, 62, 80, 0.22);
      margin-bottom: 28px;
      display: inline-block;
    }

    .name {
      font-family: var(--serif-display);
      font-size: clamp(2.2rem, 5.5vw, 3.4rem);
      font-weight: 600;
      color: var(--text);
      margin: 0 0 12px;
      letter-spacing: 0.02em;
      line-height: 1.1;
      font-feature-settings: "liga", "dlig", "swsh";
    }

    .dates {
      font-family: var(--serif-body);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-soft);
      margin: 0;
      letter-spacing: 0.03em;
    }

    .dates .sep {
      color: var(--accent);
      margin: 0 10px;
      font-style: normal;
    }

    /* Separador ornamental */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 36px 0 32px;
      color: var(--accent);
    }
    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-soft) 50%, transparent);
    }
    .divider .symbol {
      font-family: var(--serif-display);
      font-size: 1.4rem;
      letter-spacing: 0.4em;
      padding-left: 0.4em; /* compensa el letter-spacing */
      opacity: 0.8;
    }

    .location-wrapper {
      text-align: center;
      margin-bottom: 36px;
    }

    .location {
      display: inline-block;
      font-family: var(--serif-body);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #4b5a4c;
      background: var(--accent-soft);
      padding: 9px 22px;
      border-radius: 2px;
    }

    .bio {
      font-family: var(--serif-body);
      text-align: justify;
      white-space: pre-wrap;
      font-size: 1.08rem;
      color: #374151;
      line-height: 1.85;
      hyphens: auto;
    }

    /* Capitular: primera letra grande y decorativa */
    .bio::first-letter {
      font-family: var(--serif-display);
      font-weight: 700;
      font-size: 4em;
      line-height: 0.85;
      float: left;
      padding: 0.08em 0.12em 0 0;
      color: var(--accent);
    }

    /* En pantallas pequeñas, sin capitular para evitar problemas */
    @media (max-width: 600px) {
      .bio::first-letter { font-size: 1em; float: none; color: inherit; font-weight: inherit; }
      .card { padding: 44px 26px 36px; border-radius: 4px; }
      .card::before, .card::after { left: 24px; right: 24px; }
      .photo { width: 130px; height: 130px; }
      .bio { text-align: left; }
    }

    .error {
      text-align: center;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      padding: 20px;
      border-radius: 8px;
      font-family: var(--serif-body);
      font-weight: 500;
    }

    .loading {
      text-align: center;
      color: var(--text-soft);
      font-style: italic;
      font-family: var(--serif-body);
      font-size: 1.1rem;
    }

    .footer {
      margin-top: 40px;
      font-family: var(--serif-body);
      font-size: 0.72rem;
      color: var(--text-soft);
      text-align: center;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card" id="app">
      <p class="loading">Cargando historial…</p>
    </main>
    <footer class="footer">Memoria · Historial digital</footer>
  </div>

  <script src="supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://rlsmguxaujmafdurjetk.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_viPv4ZhQPMQjDaCSnggKEw_5z8SLS7D';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const appDiv = document.getElementById('app');

    const urlParams = new URLSearchParams(window.location.search);
    const codigoNicho = urlParams.get('nicho');

    function formatearFecha(fecha) {
      if (!fecha) return '';
      const [y, m, d] = fecha.split('-');
      if (!y || !m || !d) return fecha;
      return `${d}/${m}/${y}`;
    }

    async function cargarHistorial() {
      if (!codigoNicho) {
        appDiv.innerHTML = '<p class="error">No se proporcionó un código de nicho válido en la URL.</p>';
        return;
      }

      const { data: nichoData, error: nichoError } = await supabaseClient
        .from('niches')
        .select('id, ubicacion')
        .eq('codigo_qr', codigoNicho)
        .single();

      if (nichoError || !nichoData) {
        appDiv.innerHTML = '<p class="error">No se encontró ningún nicho con ese código.</p>';
        console.error(nichoError);
        return;
      }

      const { data: fallecidoData, error: fallecidoError } = await supabaseClient
        .from('fallecidos')
        .select('*')
        .eq('nicho_id', nichoData.id)
        .single();

      if (fallecidoError || !fallecidoData) {
        appDiv.innerHTML = '<p class="error">No se encontraron registros de fallecidos para este nicho.</p>';
        console.error(fallecidoError);
        return;
      }

      const fotoHtml = fallecidoData.foto_url
        ? `<img src="${fallecidoData.foto_url}" alt="Foto de ${fallecidoData.nombre_completo}" class="photo">`
        : '';

      const partes = [];
      if (fallecidoData.fecha_nacimiento) partes.push(formatearFecha(fallecidoData.fecha_nacimiento));
      if (fallecidoData.fecha_fallecimiento) partes.push(formatearFecha(fallecidoData.fecha_fallecimiento));
      const fechasHtml = partes.length
        ? `<p class="dates">${partes.join('<span class="sep">—</span>')}</p>`
        : '';

      appDiv.innerHTML = `
        <div class="header">
          ${fotoHtml}
          <h1 class="name">${fallecidoData.nombre_completo}</h1>
          ${fechasHtml}
        </div>
        <div class="divider"><span class="symbol">❧</span></div>
        ${nichoData.ubicacion ? `<div class="location-wrapper"><span class="location">${nichoData.ubicacion}</span></div>` : ''}
        <div class="bio">${fallecidoData.biografia || 'No hay una biografía registrada.'}</div>
      `;
    }

    cargarHistorial();
  </script>
</body>
</html>
